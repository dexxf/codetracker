spring:
  application:
    name: codetracker
  data:
    redis:
      host: ${REDIS_HOST:redis-cache}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_HIKARI_MAXIMUM_POOL_SIZE}
      minimum-idle: ${DB_HIKARI_MINIMUM_IDLE}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT}
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  cookie:
    jwt:
      secure: ${APP_COOKIE_JWT_SECURE}
      http-only: true
      domain: ${APP_COOKIE_DOMAIN:}
      path: /
      same-site: ${APP_COOKIE_SAME_SITE}

    refresh:
      secure: ${APP_COOKIE_REFRESH_SECURE}
      http-only: true
      domain: ${APP_COOKIE_DOMAIN:}
      path: /
      same-site: ${APP_COOKIE_SAME_SITE}

    device:
      secure: ${APP_COOKIE_DEVICE_SECURE}
      http-only: false
      domain: ${APP_COOKIE_DOMAIN:}
      path: /
      same-site: ${APP_COOKIE_SAME_SITE}

github:
  authorization-url: "https://github.com/login/oauth/authorize"
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}
  scope: ${GITHUB_SCOPE}
  allow-signup: ${GITHUB_ALLOW_SIGNUP}
  prompt-consent: ${GITHUB_PROMPT_CONSENT}

encryption:
  password: ${ENCRYPTION_PASSWORD}
  salt: ${ENCRYPTION_SALT}

jwt:
  secret: ${JWT_SECRET}
  expiration:
    ms: 300000

rest-client:
  connect-timeout-ms: 5000
  read-timeout-ms: 10000

refresh:
  token:
    lifetime:
      hour: 168

device:
  expiration:
    week: 12

cloudinary:
  url: ${CLOUDINARY_URL}
  announcement:
    attachment:
      folder-path: "announcement/"
      supported-types:
        IMAGE:
          mime-types:
            - image/jpeg
            - image/png
            - image/gif
            - image/webp
            - image/bmp
            - image/svg+xml
          extensions:
            - jpg
            - jpeg
            - png
            - gif
            - webp
            - bmp
            - svg
        VIDEO:
          mime-types:
            - video/mp4
            - video/webm
            - video/quicktime
            - video/x-msvideo
            - video/x-matroska
          extensions:
            - mp4
            - webm
            - mov
            - avi
            - mkv
        AUDIO:
          mime-types:
            - audio/mpeg
            - audio/wav
            - audio/ogg
            - audio/aac
          extensions:
            - mp3
            - wav
            - ogg
            - aac
        FILE:
          mime-types:
            - application/pdf
          extensions:
            - pdf
